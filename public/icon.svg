<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 大福の断面。名前の由来は和菓子ではなく大福帳（元帳）だが、帳面や算盤を
       描いても家計簿アプリの棚で見分けが付かないので和菓子側に振っている。
       地は薄水、図は紺。**leaves と地と図が逆**（あちらは紺地に薄水の葉）。
       ホーム画面に2つ並ぶので、明暗が反転していればひと目で別物と分かる。
       黄は使わない。毎日見るものなので静かなほうがいい（leaves と同じ判断）。

       形の決めごと（測って決めた。DESIGN.md「アイコン」参照）:
       - 底の角丸は 64。88 を超えると接地面が幅の半分を切って小判に見える
       - 肩は円弧を3次ベジエで近似する定数 0.5523 で引く。
         制御点を上げると天井が平らになって小判に寄る
       - 外形は 134..378 で中心 256。**上下の中心に乗せる**（ずれると浮いて見える）
       - 餡は中心から 8px 下。上の餅 46 / 下の餅 30 -->
  <rect width="512" height="512" rx="112" fill="#e8f1ff"/>
  <path d="M80 296 C80 216 159 152 256 152 C353 152 432 216 432 296
           A64 64 0 0 1 368 360 L144 360 A64 64 0 0 1 80 296 Z"
        fill="none" stroke="#003156" stroke-width="36" stroke-linejoin="round"/>
  <ellipse cx="256" cy="264" rx="98" ry="48" fill="#003156"/>
</svg>
